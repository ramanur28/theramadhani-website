services:
  # Astro 5 Development Server with Hot Reloading
  astro:
    image: node:22-alpine
    container_name: ramadhani-astro-dev
    working_dir: /app
    ports:
      - "4321:4321"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - SITE_URL=http://localhost:4321
    command: sh -c "npm install && npm run dev"
    restart: unless-stopped

  # Decap CMS Local Backend Proxy for testing Git operations locally
  decap-cms-proxy:
    image: node:22-alpine
    container_name: ramadhani-decap-proxy
    working_dir: /app
    ports:
      - "8081:8081"
    volumes:
      - .:/app
    environment:
      - PORT=8081
    command: npx decap-server
    restart: unless-stopped