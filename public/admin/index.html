<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Content Manager | Ramadhani</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
        <!-- Clean URL to Hash Router Bridge -->
    <script>
      (function() {
        var path = window.location.pathname;
        if (path.indexOf('/admin/collections') === 0 || path.indexOf('/admin/media') === 0) {
          var subRoute = path.replace(/^\/admin/, '');
          var targetUrl = '/admin/#' + subRoute + window.location.search;
          window.location.replace(targetUrl);
        }
      })();
    </script>
    <!-- Explicit CMS Config Link -->
    <link href="/admin/config.yml" type="text/yaml" rel="cms-config-url" />
    <!-- AI Article Studio Stylesheet -->
    <link rel="stylesheet" href="/admin/ai-studio.css" />
    <!-- Article Planner Stylesheet -->
    <link rel="stylesheet" href="/admin/article-planner.css" />
    <style>
      /* Decap CMS Modern UI Enhancements */
      :root {
        --decap-accent: #D97706;
      }
      /* Editor font smoothness */
      body {
        -webkit-font-smoothing: antialiased;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
      /* Clean scrollbars */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #F4F4F0;
      }
      ::-webkit-scrollbar-thumb {
        background: #D1D5DB;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #9CA3AF;
      }
    </style>
  </head>
  <body>
    <!-- Decap CMS Script -->
    <script src="https://unpkg.com/decap-cms@^3.1.2/dist/decap-cms.js"></script>
    <!-- Preview Styling & Editor Component Registration -->
    <script src="/admin/preview.js"></script>
    <!-- AI Article Studio Client Engine -->
    <script src="/admin/ai-studio.js"></script>
    <!-- Article Planner Engine -->
    <script src="/admin/article-planner.js"></script>
  </body>
</html>
